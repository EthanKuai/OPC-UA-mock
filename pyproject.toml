[project]
name = "opcua-mock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.0,<3",
    "pymodbus>=3.14.0,<4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract"]
