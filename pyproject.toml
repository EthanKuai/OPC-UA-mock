[project]
name = "opcua-mock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=2.0,<3",
    "pymodbus>=3.14.0,<4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/contract",
    "src/machine",
    "src/plc",
    "src/gateway",
    "src/client",
    "src/rogue",
    "src/security",
]

[tool.ruff]
extend-exclude = [
    "src/contract/loader.py",
    "src/gateway/server.py",
    "src/plc/modbus_server.py",
    "src/plc/scan.py",
    "src/security/__main__.py",
    "src/security/certs.py",
    "src/security/validator.py",
    "tests/test_client_integration.py",
    "tests/test_latency.py",
    "tests/test_machine.py",
    "tests/test_scan.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]
