meta:
  namespace_uri: "http://mock.local/plant/"
  word_order: high_first
  byte_order: big
  scan_period_ms: 10
  poll_period_ms: 100

signals:
  # uint32 at addr 10 occupies registers 10-11 (two registers)...
  - name: CNC1.PartCount
    iec: "%MD10"
    modbus: {table: holding, addr: 10, type: uint32}
    opcua: {id: "s=CNC1.PartCount", type: Int64, access: RO}
    owner: plc
  # ...so this uint16 "next door" at addr 11 actually collides with it.
  - name: Conveyor1.SpeedSetpoint
    iec: "%MW11"
    modbus: {table: holding, addr: 11, type: uint16, scale: 0.001}
    opcua: {id: "s=Conveyor1.SpeedSetpoint", type: Double, unit: "m/s", access: RW}
    owner: gateway

command_block:
  base: 100
  layout: [cmd_code, arg0_lo, arg0_hi, seq]
ack_block:
  base: 110
  layout: [ack_seq, ack_result]
