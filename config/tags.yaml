meta:
  namespace_uri: "http://mock.local/plant/"
  word_order: high_first        # 32-bit values: high word at lower address
  byte_order: big               # within each 16-bit word
  scan_period_ms: 10
  poll_period_ms: 100

signals:
  - name: Conveyor1.SpeedSetpoint
    iec: "%MW10"
    modbus: {table: holding, addr: 10, type: uint16, scale: 0.001}
    opcua: {id: "s=Conveyor1.SpeedSetpoint", type: Double, unit: "m/s", access: RW}
    owner: gateway              # who is allowed to write it
  - name: Conveyor1.RampTime
    iec: "%MD12"
    modbus: {table: holding, addr: 12, type: float32}
    opcua: {id: "s=Conveyor1.RampTime", type: Float, unit: "s", access: RW}
    owner: gateway
  - name: Conveyor1.ActualSpeed
    iec: "%MW20"
    modbus: {table: input, addr: 20, type: uint16, scale: 0.001}
    opcua: {id: "s=Conveyor1.ActualSpeed", type: Double, unit: "m/s", access: RO, historize: true}
    owner: plc
  - name: Conveyor1.Position
    iec: "%MD30"
    modbus: {table: input, addr: 30, type: float32}
    opcua: {id: "s=Conveyor1.Position", type: Float, unit: "m", access: RO, historize: true}
    owner: plc
  - name: Cnc.State
    iec: "%MW40"
    modbus: {table: input, addr: 40, type: uint16}
    # A FiniteStateMachineType, not a plain Variable - see OpcUaMapping.states.
    # 0 doubles as the register's own power-on default and the machine's
    # real initial state, so a cold PLC needs no special-casing here either.
    opcua:
      id: "s=Cnc.State"
      access: RO
      states: {0: Idle, 1: Homing, 2: Loading, 3: Running, 4: Unloading, 5: Fault}
    owner: plc

command_block:                  # written atomically with FC16
  base: 100
  layout: [cmd_code, arg0_lo, arg0_hi, seq]
ack_block:
  base: 110
  layout: [ack_seq, ack_result]
